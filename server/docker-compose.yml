version: "3.9"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowsense
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3333:3333"
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://admin:admin@db:5432/flowsense?schema=public"
      JWT_SECRET: "seu_secret_jwt_super_seguro_aqui_min_32_caracteres"
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: "587"
      SMTP_USER: "ketleysouza55@gmail.com"
      SMTP_PASSWORD: "zcnrmdmdfzqcxpia"
      SMTP_FROM: "noreply@flowsense.local"
      FRONTEND_URL: "http://localhost:5173"
    depends_on:
      - db
    command: sh -c "npm install && npm run dev"

volumes:
  db_data:
